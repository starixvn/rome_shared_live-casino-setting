<table class="pt-setting">
    <thead>
        <tr>
            <th class="col-xs-4">
                {{language.getString('lblSuperMaxPosition')}}
            </th>
            <th class="col-xs-4">
                {{language.getString('lblSuperMinPosition')}}
            </th>
            <th class="col-xs-4">
                {{language.getString('lblSuperCommission')}}
            </th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>
                <select id="ddlS4" 
                data-ng-model="positionTaking.S4" 
                data-ng-options="item.id as item.value for item in superMaxOptions" 
                data-ng-disabled="isReadOnly"
                data-ng-change="updateSuperMax()"></select>
            </td>
            <td>
                <select id="ddlN4"
                data-ng-model="positionTaking.N4" 
                data-ng-options="item.id as item.value for item in superMinOptions"
                data-ng-disabled="isReadOnly"></select>
            </td>
            <td>
                <select id="ddlCom"
                data-ng-model="commission" 
                data-ng-options="item.id as item.value for item in superCommissionOptions"
                data-ng-disabled="isReadOnly"></select>
            </td>
        </tr>
    </tbody>
</table>
