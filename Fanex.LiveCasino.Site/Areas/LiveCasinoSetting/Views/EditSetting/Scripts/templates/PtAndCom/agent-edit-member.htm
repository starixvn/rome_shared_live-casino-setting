<table class="pt-setting">
    <thead>
        <tr>
            <th class="col-xs-6">
                {{language.getString('lblAgentPresetPT')}}
            </th>
            <th class="col-xs-6">
               {{language.getString('lblMemberCommission')}}
            </th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>
                <select id="ddlA1" data-ng-model="ptAndComSetting.PositionTaking.A1" 
                data-ng-options="item.id as item.value for item in agentPresetOptions" 
                data-ng-disabled="isReadOnly"
                data-ng-change="agentPresetChange()"
                ></select>
            </td>
            <td>
                <select  id="ddlCom"
                data-ng-model="ptAndComSetting.Commission.Value" 
                data-ng-options="item.id as item.value for item in memberCommissionOptions" 
                data-ng-disabled="isReadOnly"></select>
            </td>
        </tr>
    </tbody>
</table>
