<table class="pt-setting">
    <thead>
        <tr>
            <th class="col-xs-3">
                {{language.getString('lblSuperPT')}}
            </th>
            <th class="col-xs-3">
                {{language.getString('lblSuperAutoPT')}}
            </th>
            <th class="col-xs-3">
                {{language.getString('lblMasterPT')}}
            </th>
            <th class="col-xs-3">
                {{language.getString('lblAgentPT')}}
            </th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>
                <select id="ddlS1"
                data-ng-model="ptAndComSetting.PositionTaking.S1" 
                data-ng-options="item.id as item.value for item in superPTOptions" 
                data-ng-disabled="ptAndComSetting.PositionTaking.Is1"
                data-ng-change="superPTChange()"
                data-ng-if="!ptAndComSetting.PositionTaking.Is3"></select>
                <span data-ng-if="ptAndComSetting.PositionTaking.Is3">{{ptAndComSetting.PositionTaking.S1}}</span>
            </td>
            <td>
                <input id="cbIs1" type="checkbox" data-ng-model="ptAndComSetting.PositionTaking.Is1" />
                <select id="ddlUs1"
                data-ng-model="ptAndComSetting.PositionTaking.Us1" 
                data-ng-options="item.id as item.value for item in superAutoPTOptions"
                data-ng-disabled="!ptAndComSetting.PositionTaking.Is1"></select>
            </td>
            <td>
                {{ptAndComSetting.PositionTaking.M1}}
            </td>
            <td>
                {{ptAndComSetting.PositionTaking.A1}}
            </td>
        </tr>
    </tbody>
</table>
