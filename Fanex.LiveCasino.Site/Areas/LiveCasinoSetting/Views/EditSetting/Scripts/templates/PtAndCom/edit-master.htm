<table class="pt-setting">
    <thead>
        <tr>
            <th class="col-xs-2">
                {{language.getString('lblSuperPresetPT')}}
            </th>
            <th class="col-xs-3">
                {{language.getString('lblSuperAutoPresetPT')}}
            </th>
            <th class="col-xs-2">
                {{language.getString('lblMasterMaxPT')}}
            </th>
            <th class="col-xs-2">
                {{language.getString('lblMasterMinPT')}}
            </th>
            <th class="col-xs-2">
                {{language.getString('lblMasterComm')}}
            </th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>
                <select data-ng-model="ptAndComSetting.PositionTaking.S3" 
                data-ng-options="item.id as item.value for item in superPresetOptions" 
                data-ng-disabled="ptAndComSetting.PositionTaking.Is3"
                data-ng-change="updateSuperPreset()"></select>
            </td>
            <td>
                <input type="checkbox" data-ng-model="ptAndComSetting.PositionTaking.Is3" />
                <select 
                data-ng-model="ptAndComSetting.PositionTaking.Us3" 
                data-ng-options="item.id as item.value for item in superAutoPresetOptions"
                data-ng-disabled="!ptAndComSetting.PositionTaking.Is3"
                data-ng-change="updateSuperPreset()"></select>
            </td>
            <td>
                <select data-ng-model="ptAndComSetting.PositionTaking.M3" 
                data-ng-options="item.id as item.value for item in masterMaxOptions"
                data-ng-change="updateMasterMax()"></select>
            </td>
            <td>
                <select data-ng-model="ptAndComSetting.PositionTaking.N3" 
                data-ng-options="item.id as item.value for item in masterMinOptions"
                data-ng-change="updateMasterMin()"></select>
            </td>
            <td>
                <select 
                data-ng-model="ptAndComSetting.Commission.Value" 
                data-ng-options="item.id as item.value for item in masterCommissionOptions" ></select>
            </td>
        </tr>
    </tbody>
</table>
